name: Deploy ClipForge to Single EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to EC2 Instance
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            # 1. Smart Directory Check
            if [ ! -d "~/Clip_Forge/.git" ]; then
              echo "Repository not fully initialized. Cleaning up and cloning fresh..."
              rm -rf ~/Clip_Forge
              git clone https://github.com/${{ github.repository }}.git ~/Clip_Forge
            fi

            cd ~/Clip_Forge

            echo "2. Pulling latest changes..."
            git fetch origin
            git reset --hard origin/main

            echo "3. Injecting environment variables..."
            cat > .env << 'EOF'
            GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}
            CORS_ORIGIN=${{ secrets.CORS_ORIGIN }}
            NEXT_PUBLIC_BACKEND_URL=${{ secrets.NEXT_PUBLIC_BACKEND_URL }}
            EOF

            echo "4. Building and launching Docker containers..."
            docker compose down
            docker compose up -d --build

            echo "5. Cleaning up old unused Docker assets..."
            docker image prune -f

            echo "Deployment completed successfully!"
